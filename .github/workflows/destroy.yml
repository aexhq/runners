name: Destroy runners

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "destroy <TARGET_GITHUB_ORG>" (for example, "destroy octo-org")
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: runners-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  GITHUB_ORGANIZATION: ${{ vars.TARGET_GITHUB_ORG || 'aexhq' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TF_VAR_github_organization: ${{ vars.TARGET_GITHUB_ORG || 'aexhq' }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX || 'github-runners' }}
  TF_VAR_runner_group_name: ${{ vars.RUNNER_GROUP_NAME || 'Default' }}
  TF_VAR_maximum_runner_count: ${{ vars.MAXIMUM_RUNNER_COUNT || '10' }}
  TF_VAR_availability_zone_count: ${{ vars.AVAILABILITY_ZONE_COUNT || '3' }}
  TF_VAR_repository_allow_list: ${{ vars.REPOSITORY_ALLOW_LIST || '[]' }}
  TF_VAR_create_service_linked_role_spot: ${{ vars.CREATE_SPOT_SERVICE_LINKED_ROLE || 'true' }}
  TF_VAR_runner_role_permissions_boundary_arn: ${{ vars.RUNNER_ROLE_PERMISSIONS_BOUNDARY_ARN }}

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm destructive operation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          expected="destroy ${GITHUB_ORGANIZATION}"
          if [[ "${CONFIRMATION}" != "${expected}" ]]; then
            echo "Confirmation must exactly equal: ${expected}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure AWS credentials with OIDC
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-runners-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Download pinned Lambda artifacts
        run: bash scripts/download-lambdas.sh

      - name: Locate Terraform state
        run: bash scripts/bootstrap-state.sh terraform/.backend.hcl

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend-config=.backend.hcl

      - name: Destroy runner infrastructure
        env:
          TF_VAR_github_app_id: ${{ secrets.GH_APP_ID }}
          TF_VAR_github_app_private_key_base64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
        run: terraform -chdir=terraform destroy -input=false -auto-approve

name: Deploy runners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: runners-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  GITHUB_ORGANIZATION: ${{ vars.TARGET_GITHUB_ORG || 'aexhq' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TF_VAR_github_organization: ${{ vars.TARGET_GITHUB_ORG || 'aexhq' }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX || 'github-runners' }}
  TF_VAR_runner_group_name: ${{ vars.RUNNER_GROUP_NAME || 'Default' }}
  TF_VAR_maximum_runner_count: ${{ vars.MAXIMUM_RUNNER_COUNT || '20' }}
  TF_VAR_availability_zone_count: ${{ vars.AVAILABILITY_ZONE_COUNT || '3' }}
  TF_VAR_repository_allow_list: ${{ vars.REPOSITORY_ALLOW_LIST || '[]' }}
  TF_VAR_create_service_linked_role_spot: ${{ vars.CREATE_SPOT_SERVICE_LINKED_ROLE || 'true' }}
  TF_VAR_runner_role_permissions_boundary_arn: ${{ vars.RUNNER_ROLE_PERMISSIONS_BOUNDARY_ARN }}

jobs:
  deploy:
    name: Terraform apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate required secrets
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in GH_APP_ID GH_APP_PRIVATE_KEY_BASE64 GH_APP_WEBHOOK_SECRET; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          if [[ -z "${AWS_DEPLOY_ROLE_ARN:-}" ]]; then
            [[ -n "${AWS_ACCESS_KEY_ID_VALUE:-}" ]] || missing+=("AWS_ACCESS_KEY_ID")
            [[ -n "${AWS_SECRET_ACCESS_KEY_VALUE:-}" ]] || missing+=("AWS_SECRET_ACCESS_KEY")
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify GitHub App installation
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
        run: bash scripts/verify-github-app.sh

      - name: Configure AWS credentials with OIDC
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-runners-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download pinned Lambda artifacts
        run: bash scripts/download-lambdas.sh

      - name: Create or secure Terraform state bucket
        run: bash scripts/bootstrap-state.sh terraform/.backend.hcl

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend-config=.backend.hcl

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Plan
        env:
          TF_VAR_github_app_id: ${{ secrets.GH_APP_ID }}
          TF_VAR_github_app_private_key_base64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          TF_VAR_github_app_webhook_secret: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Read webhook endpoint
        id: terraform-output
        shell: bash
        run: |
          endpoint="$(terraform -chdir=terraform output -raw webhook_endpoint)"
          echo "WEBHOOK_ENDPOINT=${endpoint}" >> "${GITHUB_ENV}"
          echo "endpoint=${endpoint}" >> "${GITHUB_OUTPUT}"

      - name: Configure GitHub App webhook
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GH_APP_WEBHOOK_SECRET: ${{ secrets.GH_APP_WEBHOOK_SECRET }}
        run: bash scripts/configure-github-webhook.sh

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo '## EC2 Spot runners deployed'
            echo
            echo "- Organization: \`${GITHUB_ORGANIZATION}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo '- Selector: `runs-on: [self-hosted, linux, x64, ec2-spot]`'
            echo "- Webhook: \`${WEBHOOK_ENDPOINT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
